name: Daily review reminder

on:
  schedule:
    # Times in UTC; Europe/Warsaw is UTC+1 in winter (+2 in summer)
    - cron: '30 6 * * *' # 07:30 - announce the new daily PR
    - cron: '0 16 * * *' # 17:00 - remind if it is still open
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Mention the owner on open daily PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          MORNING: ${{ github.event.schedule == '30 6 * * *' }}
        run: |
          prs=$(gh pr list --label daily --state open --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "No open daily PRs - nothing to remind about."
            exit 0
          fi
          if [ "$MORNING" = "true" ]; then
            message="📚 Today's daily topic is ready for review."
          else
            message="⏰ This daily topic is still waiting for your review."
          fi
          for pr in $prs; do
            gh pr comment "$pr" --body "@$OWNER $message"
          done
